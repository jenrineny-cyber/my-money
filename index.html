```html
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Money 💸</title>

<style>

* {
  box-sizing: border-box;
  font-family: "Arial", sans-serif;
}

body {
  margin: 0;
  background:
    linear-gradient(135deg, #fff4fb, #f5efff, #eef7ff);
  color: #40364d;
}

/* CONTAINER */

.container {
  max-width: 480px;
  margin: auto;
  padding: 20px 16px 50px;
}

/* HEADER */

.header {
  text-align: center;
  padding: 15px 0 20px;
}

.header h1 {
  margin: 0;
  font-size: 36px;
  color: #b36bd4;
  text-shadow: 2px 2px 0 #f4d9ff;
}

.header p {
  color: #9a8da6;
  margin: 8px 0;
  font-size: 14px;
}

/* CARD */

.card {
  background: rgba(255,255,255,0.9);
  border-radius: 25px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 8px 25px rgba(160,120,190,0.12);
  border: 1px solid rgba(255,255,255,0.8);
}

/* BALANCE */

.balance {
  background: linear-gradient(135deg, #ead7ff, #fbdcf2);
  text-align: center;
  padding: 25px 20px;
}

.balance small {
  color: #8c62a8;
  font-size: 14px;
}

.balance h2 {
  font-size: 40px;
  margin: 8px 0 0;
  color: #8650b5;
}

/* SUMMARY */

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 14px 0;
}

.summary-box {
  text-align: center;
  padding: 18px 10px;
  border-radius: 20px;
  font-size: 14px;
}

.summary-box b {
  display: block;
  font-size: 21px;
  margin-top: 7px;
}

.income {
  background: #e2f8eb;
  color: #3c9b61;
}

.expense {
  background: #ffe5ee;
  color: #d65b7b;
}

/* HEADINGS */

h3 {
  margin-top: 0;
  color: #76558d;
}

/* LABEL */

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin: 13px 0 6px;
  color: #66566f;
}

/* INPUT */

input,
select {
  width: 100%;
  padding: 13px;
  border: 2px solid #eee4f4;
  border-radius: 15px;
  background: #fffaff;
  font-size: 15px;
  outline: none;
}

input:focus,
select:focus {
  border-color: #d4a5e8;
}

/* TYPE BUTTONS */

.type-buttons {
  display: flex;
  gap: 10px;
}

.type-buttons button {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 15px;
  background: #f1edf3;
  font-size: 15px;
  cursor: pointer;
  transition: 0.2s;
}

.type-buttons .active-income {
  background: #c9efd8;
  color: #318653;
  font-weight: bold;
}

.type-buttons .active-expense {
  background: #ffd0df;
  color: #c44d70;
  font-weight: bold;
}

/* SAVE BUTTON */

.save-btn {
  width: 100%;
  margin-top: 17px;
  padding: 15px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #b878d8, #d889b9);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(190,120,210,0.25);
}

.save-btn:hover {
  transform: translateY(-1px);
}

/* TRANSACTION */

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #f0eaf3;
}

.item:last-child {
  border-bottom: none;
}

.item-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: #f6edff;
  display: grid;
  place-items: center;
  font-size: 20px;
}

.item-name {
  font-weight: bold;
  font-size: 14px;
}

.item-date {
  font-size: 12px;
  color: #aaa;
  margin-top: 4px;
}

.income-text {
  color: #3d9b62;
  font-weight: bold;
}

.expense-text {
  color: #d45676;
  font-weight: bold;
}

.delete-btn {
  border: none;
  background: #fff0f4;
  color: #c8899d;
  border-radius: 8px;
  margin-left: 5px;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 20px;
}

/* DECORATION */

.container::before {
  content: "♡";
  position: fixed;
  top: 30px;
  left: 20px;
  font-size: 28px;
  color: #e7b8e9;
  opacity: .7;
}

.container::after {
  content: "✦";
  position: fixed;
  bottom: 30px;
  right: 25px;
  font-size: 25px;
  color: #c7b2ed;
  opacity: .7;
}

</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <h1>My Money 💸</h1>

    <p>บันทึกรายรับ - รายจ่ายรายสัปดาห์</p>

  </div>


  <!-- BALANCE -->

  <div class="card balance">

    <small>💰 เงินคงเหลือ</small>

    <h2 id="balance">฿0</h2>

  </div>


  <!-- WEEKLY MONEY -->

  <div class="card">

    <h3>📅 เงินประจำสัปดาห์</h3>

    <label>
      เงินที่ได้รับในสัปดาห์นี้
    </label>

    <input
      type="number"
      id="weeklyMoney"
      placeholder="เช่น 500"
    >

    <button
      class="save-btn"
      onclick="saveWeeklyMoney()"
    >
      💾 บันทึกเงินประจำสัปดาห์
    </button>

  </div>


  <!-- SUMMARY -->

  <div class="summary">

    <div class="summary-box income">

      🟢 รายรับ

      <b id="income">฿0</b>

    </div>


    <div class="summary-box expense">

      🔴 รายจ่าย

      <b id="expense">฿0</b>

    </div>

  </div>


  <!-- ADD TRANSACTION -->

  <div class="card">

    <h3>➕ เพิ่มรายการ</h3>


    <label>วันที่</label>

    <input
      type="date"
      id="date"
    >


    <label>รายการ</label>

    <input
      type="text"
      id="name"
      placeholder="เช่น ซื้อข้าว"
    >


    <label>ประเภท</label>

    <div class="type-buttons">

      <button
        id="incomeBtn"
        onclick="setType('income')"
      >
        🟢 รายรับ
      </button>


      <button
        id="expenseBtn"
        class="active-expense"
        onclick="setType('expense')"
      >
        🔴 รายจ่าย
      </button>

    </div>


    <label>หมวดหมู่</label>

    <select id="category">

      <option>🍚 อาหาร</option>

      <option>🧃 เครื่องดื่ม</option>

      <option>🛍️ ช้อปปิ้ง</option>

      <option>📚 การศึกษา</option>

      <option>🎮 ความบันเทิง</option>

      <option>🚗 การเดินทาง</option>

      <option>💗 อื่น ๆ</option>

    </select>


    <label>จำนวนเงิน (บาท)</label>

    <input
      type="number"
      id="amount"
      placeholder="เช่น 40"
    >


    <button
      class="save-btn"
      onclick="addTransaction()"
    >
      💾 บันทึกรายการ
    </button>

  </div>


  <!-- HISTORY -->

  <div class="card">

    <h3>📋 ประวัติรายการ</h3>

    <div id="transactions"></div>

  </div>

</div>


<script>

/* =========================
   GOOGLE APPS SCRIPT
========================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxV6Uzl3WIKcxlOYziLcjK09tJvHL202k06LOH1TjBWqeqYSVkCQG1YT5KSL22VOmGj/exec";


let type = "expense";


let data = JSON.parse(
  localStorage.getItem("myMoneyData")
) || {

  weeklyMoney: 0,

  transactions: []

};


/* =========================
   TYPE
========================= */

function setType(newType) {

  type = newType;


  const incomeBtn =
    document.getElementById("incomeBtn");

  const expenseBtn =
    document.getElementById("expenseBtn");


  incomeBtn.className = "";

  expenseBtn.className = "";


  if (type === "income") {

    incomeBtn.className =
      "active-income";

  } else {

    expenseBtn.className =
      "active-expense";

  }

}


/* =========================
   WEEKLY MONEY
========================= */

function saveWeeklyMoney() {

  const money =
    Number(
      document.getElementById("weeklyMoney").value
    );


  if (money < 0) {

    alert("กรุณากรอกจำนวนเงินให้ถูกต้อง");

    return;

  }


  data.weeklyMoney = money;

  saveLocal();


  alert(
    "บันทึกเงินประจำสัปดาห์แล้ว 💰"
  );

}


/* =========================
   ADD TRANSACTION
========================= */

async function addTransaction() {

  const date =
    document.getElementById("date").value;


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const category =
    document.getElementById("category").value;


  const amount =
    Number(
      document.getElementById("amount").value
    );


  if (!date || !name || amount <= 0) {

    alert(
      "กรุณากรอกข้อมูลให้ครบถ้วน 💗"
    );

    return;

  }


  const transaction = {

    id: Date.now(),

    date: date,

    name: name,

    type: type,

    category: category,

    amount: amount

  };


  data.transactions.push(transaction);


  saveLocal();

  render();


  /* ส่งข้อมูลเข้า Google Sheets */

  try {

    await fetch(SCRIPT_URL, {

      method: "POST",

      mode: "no-cors",

      headers: {

        "Content-Type":
        "text/plain;charset=utf-8"

      },

      body: JSON.stringify({

        date: date,

        name: name,

        type: type,

        category: category,

        amount: amount,

        week: getWeek(date)

      })

    });


    alert(
      "บันทึกรายการเรียบร้อยแล้ว 💜"
    );


  } catch (error) {

    alert(
      "บันทึกไว้ในเครื่องแล้ว แต่ไม่สามารถเชื่อมต่อ Google Sheets ได้"
    );

  }


  document.getElementById("name").value = "";

  document.getElementById("amount").value = "";

}


/* =========================
   WEEK
========================= */

function getWeek(dateString) {

  const date =
    new Date(dateString);


  const firstDay =
    new Date(
      date.getFullYear(),
      0,
      1
    );


  const days =
    Math.floor(
      (date - firstDay) /
      (24 * 60 * 60 * 1000)
    );


  return (
    "สัปดาห์ที่ " +
    Math.ceil(
      (days +
       firstDay.getDay() +
       1) / 7
    )
  );

}


/* =========================
   DELETE
========================= */

function deleteTransaction(id) {

  data.transactions =
    data.transactions.filter(
      item => item.id !== id
    );


  saveLocal();

  render();

}


/* =========================
   SAVE LOCAL
========================= */

function saveLocal() {

  localStorage.setItem(

    "myMoneyData",

    JSON.stringify(data)

  );


  render();

}


/* =========================
   RENDER
========================= */

function render() {

  let income =
    data.weeklyMoney;


  let expense = 0;


  data.transactions.forEach(item => {

    if (item.type === "income") {

      income += item.amount;

    } else {

      expense += item.amount;

    }

  });


  const balance =
    income - expense;


  document.getElementById("income")
    .innerText =
    "฿" +
    income.toLocaleString();


  document.getElementById("expense")
    .innerText =
    "฿" +
    expense.toLocaleString();


  document.getElementById("balance")
    .innerText =
    "฿" +
    balance.toLocaleString();


  document.getElementById("weeklyMoney")
    .value =
    data.weeklyMoney || "";


  const container =
    document.getElementById(
      "transactions"
    );


  if (data.transactions.length === 0) {

    container.innerHTML =

      `<div class="empty">

        ยังไม่มีรายการ ✨

      </div>`;

    return;

  }


  const sorted =
    [...data.transactions].sort(

      (a, b) =>

        new Date(b.date) -
        new Date(a.date)

    );


  container.innerHTML =

    sorted.map(item => {

      const isIncome =
        item.type === "income";


      return `

        <div class="item">

          <div class="item-info">

            <div class="icon">

              ${isIncome
                ? "💰"
                : "🛍️"}

            </div>


            <div>

              <div class="item-name">

                ${escapeHTML(
                  item.name
                )}

              </div>


              <div class="item-date">

                ${item.date}

                •

                ${escapeHTML(
                  item.category
                )}

              </div>

            </div>

          </div>


          <div>

            <span class="${
              isIncome
              ? "income-text"
              : "expense-text"
            }">

              ${isIncome
                ? "+"
                : "-"}

              ฿${item.amount.toLocaleString()}

            </span>


            <button

              class="delete-btn"

              onclick="
                deleteTransaction(
                  ${item.id}
                )
              "

            >

              ✕

            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

  return text.replace(

    /[&<>"']/g,

    function(character) {

      return {

        "&": "&amp;",

        "<": "&lt;",

        ">": "&gt;",

        '"': "&quot;",

        "'": "&#039;"

      }[character];

    }

  );

}


/* =========================
   DEFAULT DATE
========================= */

document.getElementById("date")
  .value =

  new Date()
    .toISOString()
    .split("T")[0];


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
