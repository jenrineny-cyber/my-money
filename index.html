<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Money 💸</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f7f3ff;
  color: #302b3d;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 20px 16px 40px;
}

.header {
  text-align: center;
  padding: 10px 0 18px;
}

.header h1 {
  margin: 0;
  color: #7654c7;
  font-size: 34px;
}

.header p {
  color: #888;
  margin: 6px 0;
}

.card {
  background: white;
  border-radius: 22px;
  padding: 18px;
  margin: 12px 0;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.balance {
  background: #eadfff;
  text-align: center;
}

.balance small {
  color: #7254ad;
}

.balance h2 {
  font-size: 38px;
  margin: 7px 0;
  color: #6846b5;
}

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.summary-box {
  text-align: center;
  padding: 15px;
  border-radius: 18px;
}

.income {
  background: #e5f8ec;
  color: #278f50;
}

.expense {
  background: #ffe8e8;
  color: #d14b4b;
}

.summary-box b {
  display: block;
  font-size: 21px;
  margin-top: 5px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin: 12px 0 6px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #ddd;
  border-radius: 13px;
  background: #faf9ff;
  font-size: 15px;
}

.type-buttons {
  display: flex;
  gap: 10px;
}

.type-buttons button {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 13px;
  background: #eee;
  font-size: 15px;
  cursor: pointer;
}

.type-buttons .active-income {
  background: #bfeccd;
}

.type-buttons .active-expense {
  background: #ffcaca;
}

.save-btn {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border: none;
  border-radius: 14px;
  background: #7654c7;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.item:last-child {
  border-bottom: none;
}

.item-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: #f1edff;
  display: grid;
  place-items: center;
}

.item-name {
  font-weight: bold;
}

.item-date {
  font-size: 12px;
  color: #999;
  margin-top: 3px;
}

.income-text {
  color: #278f50;
  font-weight: bold;
}

.expense-text {
  color: #d14b4b;
  font-weight: bold;
}

.delete-btn {
  border: none;
  background: none;
  color: #aaa;
  cursor: pointer;
}

.empty {
  text-align: center;
  color: #aaa;
  padding: 15px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>My Money 💸</h1>
    <p>Weekly Income & Expense Tracker</p>
  </div>

  <div class="card balance">
    <small>💰 Current Balance</small>
    <h2 id="balance">฿0</h2>
  </div>

  <div class="card">

    <h3>📅 Weekly Allowance</h3>

    <label>Money received this week</label>

    <input
      type="number"
      id="weeklyMoney"
      placeholder="Example: 500"
    >

    <button
      class="save-btn"
      onclick="saveWeeklyMoney()"
    >
      💾 Save Weekly Money
    </button>

  </div>

  <div class="summary">

    <div class="summary-box income">
      🟢 Income
      <b id="income">฿0</b>
    </div>

    <div class="summary-box expense">
      🔴 Expenses
      <b id="expense">฿0</b>
    </div>

  </div>

  <div class="card">

    <h3>➕ Add Transaction</h3>

    <label>Date</label>

    <input type="date" id="date">

    <label>Description</label>

    <input
      type="text"
      id="name"
      placeholder="Example: Lunch"
    >

    <label>Type</label>

    <div class="type-buttons">

      <button
        id="incomeBtn"
        onclick="setType('income')"
      >
        🟢 Income
      </button>

      <button
        id="expenseBtn"
        class="active-expense"
        onclick="setType('expense')"
      >
        🔴 Expense
      </button>

    </div>

    <label>Category</label>

    <select id="category">

      <option>🍚 Food</option>
      <option>🧃 Drinks</option>
      <option>🛍️ Shopping</option>
      <option>📚 Education</option>
      <option>🎮 Entertainment</option>
      <option>🚗 Transportation</option>
      <option>Other</option>

    </select>

    <label>Amount (THB)</label>

    <input
      type="number"
      id="amount"
      placeholder="Example: 40"
    >

    <button
      class="save-btn"
      onclick="addTransaction()"
    >
      💾 Save Transaction
    </button>

  </div>

  <div class="card">

    <h3>📋 Transaction History</h3>

    <div id="transactions"></div>

  </div>

</div>

<script>

/* =========================
   GOOGLE APPS SCRIPT URL
========================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxV6Uzl3WIKcxlOYziLcjK09tJvHL202k06LOH1TjBWqeqYSVkCQG1YT5KSL22VOmGj/exec";


let type = "expense";

let data = JSON.parse(
  localStorage.getItem("myMoneyData")
) || {
  weeklyMoney: 0,
  transactions: []
};


/* =========================
   TYPE
========================= */

function setType(newType) {

  type = newType;

  const incomeBtn =
    document.getElementById("incomeBtn");

  const expenseBtn =
    document.getElementById("expenseBtn");

  incomeBtn.className = "";
  expenseBtn.className = "";

  if (type === "income") {

    incomeBtn.className =
      "active-income";

  } else {

    expenseBtn.className =
      "active-expense";

  }

}


/* =========================
   WEEKLY MONEY
========================= */

function saveWeeklyMoney() {

  const money =
    Number(
      document.getElementById("weeklyMoney").value
    );

  if (money < 0) {

    alert("Please enter a valid amount.");

    return;
  }

  data.weeklyMoney = money;

  saveLocal();

  alert(
    "Weekly money saved successfully! 💰"
  );

}


/* =========================
   ADD TRANSACTION
========================= */

async function addTransaction() {

  const date =
    document.getElementById("date").value;

  const name =
    document.getElementById("name").value.trim();

  const category =
    document.getElementById("category").value;

  const amount =
    Number(
      document.getElementById("amount").value
    );


  if (!date || !name || amount <= 0) {

    alert("Please complete all information.");

    return;
  }


  const transaction = {

    id: Date.now(),

    date: date,

    name: name,

    type: type,

    category: category,

    amount: amount

  };


  data.transactions.push(transaction);

  saveLocal();

  render();


  /* Send data to Google Sheets */

  try {

    await fetch(SCRIPT_URL, {

      method: "POST",

      mode: "no-cors",

      headers: {
        "Content-Type": "text/plain;charset=utf-8"
      },

      body: JSON.stringify({

        date: date,

        name: name,

        type: type,

        category: category,

        amount: amount,

        week: getWeek(date)

      })

    });

    alert(
      "Saved successfully! 💜"
    );

  } catch (error) {

    alert(
      "Saved on this device, but could not connect to Google Sheets."
    );

  }


  document.getElementById("name").value = "";

  document.getElementById("amount").value = "";

}


/* =========================
   WEEK NUMBER
========================= */

function getWeek(dateString) {

  const date =
    new Date(dateString);

  const firstDay =
    new Date(
      date.getFullYear(),
      0,
      1
    );

  const days =
    Math.floor(
      (date - firstDay) /
      (24 * 60 * 60 * 1000)
    );

  return (
    "Week " +
    Math.ceil(
      (days + firstDay.getDay() + 1) / 7
    )
  );

}


/* =========================
   DELETE
========================= */

function deleteTransaction(id) {

  data.transactions =
    data.transactions.filter(
      item => item.id !== id
    );

  saveLocal();

  render();

}


/* =========================
   SAVE LOCAL
========================= */

function saveLocal() {

  localStorage.setItem(
    "myMoneyData",
    JSON.stringify(data)
  );

  render();

}


/* =========================
   RENDER
========================= */

function render() {

  let income =
    data.weeklyMoney;

  let expense = 0;


  data.transactions.forEach(item => {

    if (item.type === "income") {

      income += item.amount;

    } else {

      expense += item.amount;

    }

  });


  const balance =
    income - expense;


  document.getElementById("income")
    .innerText =
    "฿" + income.toLocaleString();


  document.getElementById("expense")
    .innerText =
    "฿" + expense.toLocaleString();


  document.getElementById("balance")
    .innerText =
    "฿" + balance.toLocaleString();


  document.getElementById("weeklyMoney")
    .value =
    data.weeklyMoney || "";


  const container =
    document.getElementById(
      "transactions"
    );


  if (data.transactions.length === 0) {

    container.innerHTML =
      `<div class="empty">
        No transactions yet ✨
      </div>`;

    return;

  }


  const sorted =
    [...data.transactions].sort(
      (a, b) =>
        new Date(b.date) -
        new Date(a.date)
    );


  container.innerHTML =
    sorted.map(item => {

      const isIncome =
        item.type === "income";

      return `

        <div class="item">

          <div class="item-info">

            <div class="icon">
              ${isIncome ? "💰" : "🛍️"}
            </div>

            <div>

              <div class="item-name">
                ${escapeHTML(item.name)}
              </div>

              <div class="item-date">
                ${item.date} •
                ${escapeHTML(item.category)}
              </div>

            </div>

          </div>


          <div>

            <span class="${
              isIncome
              ? "income-text"
              : "expense-text"
            }">

              ${isIncome ? "+" : "-"}
              ฿${item.amount.toLocaleString()}

            </span>


            <button
              class="delete-btn"
              onclick="deleteTransaction(${item.id})"
            >
              ✕
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

  return text.replace(
    /[&<>"']/g,
    function(character) {

      return {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character];

    }
  );

}


/* =========================
   DEFAULT DATE
========================= */

document.getElementById("date")
  .value =
  new Date()
  .toISOString()
  .split("T")[0];


/* =========================
   START
========================= */

render();

</script>

</body>
</html>
