<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Money 💸</title>

<style>

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(
    135deg,
    #fff1f8,
    #f4edff,
    #eef8ff
  );
  color: #40364d;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 20px 16px 50px;
}

/* HEADER */

.header {
  text-align: center;
  padding: 15px 0 20px;
}

.header h1 {
  margin: 0;
  font-size: 38px;
  color: #b36bd4;
  text-shadow: 2px 2px 0 #f5d8ff;
}

.header p {
  color: #9a8da6;
  margin: 8px 0;
  font-size: 14px;
}

/* CARD */

.card {
  background: rgba(255,255,255,0.94);
  border-radius: 25px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 8px 25px rgba(160,120,190,0.12);
}

/* WEEK */

.week-title {
  text-align: center;
  color: #8c62a8;
  font-size: 15px;
  margin-bottom: 8px;
}

/* BALANCE */

.balance {
  background: linear-gradient(
    135deg,
    #ead7ff,
    #fbdcf2
  );
  text-align: center;
  padding: 25px 20px;
}

.balance small {
  color: #8c62a8;
}

.balance h2 {
  font-size: 40px;
  margin: 8px 0 0;
  color: #8650b5;
}

/* SUMMARY */

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 14px 0;
}

.summary-box {
  text-align: center;
  padding: 18px 10px;
  border-radius: 20px;
  font-size: 14px;
}

.summary-box b {
  display: block;
  font-size: 21px;
  margin-top: 7px;
}

.income {
  background: #e2f8eb;
  color: #3c9b61;
}

.expense {
  background: #ffe5ee;
  color: #d65b7b;
}

/* TOTAL */

.total-box {
  background: #fff6d9;
  color: #aa7c22;
  text-align: center;
  padding: 18px;
  border-radius: 20px;
  margin-top: 12px;
}

.total-box b {
  display: block;
  font-size: 24px;
  margin-top: 5px;
}

/* TEXT */

h3 {
  margin-top: 0;
  color: #76558d;
}

label {
  display: block;
  font-weight: bold;
  font-size: 14px;
  margin: 13px 0 6px;
  color: #66566f;
}

/* INPUT */

input {
  width: 100%;
  padding: 13px;
  border: 2px solid #eee4f4;
  border-radius: 15px;
  background: #fffaff;
  font-size: 15px;
  outline: none;
}

input:focus {
  border-color: #d4a5e8;
}

/* TYPE */

.type-buttons {
  display: flex;
  gap: 10px;
}

.type-buttons button {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 15px;
  background: #f1edf3;
  font-size: 15px;
  cursor: pointer;
}

.type-buttons .active-income {
  background: #c9efd8;
  color: #318653;
  font-weight: bold;
}

.type-buttons .active-expense {
  background: #ffd0df;
  color: #c44d70;
  font-weight: bold;
}

/* BUTTON */

.save-btn {
  width: 100%;
  margin-top: 17px;
  padding: 15px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(
    135deg,
    #b878d8,
    #d889b9
  );
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 12px rgba(190,120,210,0.25);
}

.save-btn:active {
  transform: scale(0.98);
}

/* BACK BUTTON */

.back-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 15px;
  background: #eee3fa;
  color: #76558d;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.back-btn:hover {
  background: #e3d1f2;
}

/* BACKUP */

.backup-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.backup-btn {
  width: 100%;
  padding: 13px 8px;
  border: none;
  border-radius: 15px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

.export-btn {
  background: #e1f4ff;
  color: #4385a8;
}

.import-btn {
  background: #f4e4ff;
  color: #8759a3;
}

.backup-note {
  text-align: center;
  color: #aaa;
  font-size: 12px;
  margin: 12px 0 0;
  line-height: 1.5;
}

/* HISTORY */

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 0;
  border-bottom: 1px solid #f0eaf3;
  gap: 8px;
}

.item:last-child {
  border-bottom: none;
}

.item-info {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.icon {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  background: #f6edff;
  display: grid;
  place-items: center;
  font-size: 20px;
  flex-shrink: 0;
}

.item-name {
  font-weight: bold;
  font-size: 14px;
  word-break: break-word;
}

.item-date {
  font-size: 12px;
  color: #aaa;
  margin-top: 4px;
}

.income-text {
  color: #3d9b62;
  font-weight: bold;
  white-space: nowrap;
}

.expense-text {
  color: #d45676;
  font-weight: bold;
  white-space: nowrap;
}

.delete-btn {
  border: none;
  background: #fff0f4;
  color: #c8899d;
  border-radius: 8px;
  margin-left: 5px;
  cursor: pointer;
}

/* WEEK HISTORY */

.week-history {
  margin-top: 10px;
}

.week-card {
  background: #faf7ff;
  border: 2px solid #eee5fa;
  border-radius: 18px;
  padding: 15px;
  margin: 10px 0;
  cursor: pointer;
}

.week-card:hover {
  border-color: #d9b8ed;
}

.week-card h4 {
  margin: 0 0 8px;
  color: #79558d;
}

.week-info {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin: 4px 0;
}

.week-balance {
  font-weight: bold;
  color: #8650b5;
}

/* EMPTY */

.empty {
  text-align: center;
  color: #aaa;
  padding: 20px;
}

/* DECORATION */

.container::before {
  content: "♡";
  position: fixed;
  top: 25px;
  left: 20px;
  font-size: 28px;
  color: #e7b8e9;
  opacity: .7;
}

.container::after {
  content: "✦";
  position: fixed;
  bottom: 30px;
  right: 25px;
  font-size: 25px;
  color: #c7b2ed;
  opacity: .7;
}

</style>

</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <h1>My Money 💸</h1>

    <p>
      บันทึกรายรับ - รายจ่ายของฉัน
    </p>

  </div>


  <!-- CURRENT WEEK -->

  <div class="card">

    <div
      class="week-title"
      id="currentWeek"
    >
      สัปดาห์นี้
    </div>

    <div
      class="balance"
      style="border-radius:20px;"
    >

      <small>💵 เงินคงเหลือ</small>

      <h2 id="balance">฿0</h2>

    </div>


    <div class="total-box">

      💰 จำนวนเงินทั้งหมด

      <b id="totalMoney">
        ฿0
      </b>

    </div>

    <button
      id="backCurrentBtn"
      class="back-btn"
      onclick="goToCurrentWeek()"
      style="display:none;"
    >
      🏠 กลับมาสัปดาห์นี้
    </button>

  </div>


  <!-- SUMMARY -->

  <div class="summary">

    <div class="summary-box income">

      🟢 รายรับ

      <b id="income">
        ฿0
      </b>

    </div>


    <div class="summary-box expense">

      🔴 รายจ่าย

      <b id="expense">
        ฿0
      </b>

    </div>

  </div>


  <!-- WEEKLY MONEY -->

  <div class="card">

    <h3>
      📅 เงินประจำสัปดาห์
    </h3>

    <label>
      เงินที่ได้รับในสัปดาห์นี้
    </label>

    <input
      type="number"
      id="weeklyMoney"
      placeholder="เช่น 500"
      min="0"
    >

    <button
      class="save-btn"
      onclick="saveWeeklyMoney()"
    >
      💾 บันทึกเงินประจำสัปดาห์
    </button>

  </div>


  <!-- ADD TRANSACTION -->

  <div class="card">

    <h3>
      ➕ เพิ่มรายการ
    </h3>


    <label>
      วันที่
    </label>

    <input
      type="date"
      id="date"
    >


    <label>
      รายการ
    </label>

    <input
      type="text"
      id="name"
      placeholder="เช่น ซื้อข้าว"
    >


    <label>
      ประเภท
    </label>

    <div class="type-buttons">

      <button
        id="incomeBtn"
        onclick="setType('income')"
      >
        🟢 รายรับ
      </button>


      <button
        id="expenseBtn"
        class="active-expense"
        onclick="setType('expense')"
      >
        🔴 รายจ่าย
      </button>

    </div>


    <label>
      จำนวนเงิน (บาท)
    </label>

    <input
      type="number"
      id="amount"
      placeholder="เช่น 40"
      min="0"
      step="0.01"
    >


    <button
      class="save-btn"
      onclick="addTransaction()"
    >
      💾 บันทึกรายการ
    </button>

  </div>


  <!-- TRANSACTION HISTORY -->

  <div class="card">

    <h3 id="transactionTitle">
      📋 รายการของสัปดาห์นี้
    </h3>

    <div id="transactions"></div>

  </div>


  <!-- WEEK HISTORY -->

  <div class="card">

    <h3>
      📚 ประวัติสัปดาห์
    </h3>

    <div
      id="weekHistory"
      class="week-history"
    ></div>

  </div>


  <!-- BACKUP -->

  <div class="card">

    <h3>
      🔐 สำรองข้อมูล
    </h3>

    <div class="backup-box">

      <button
        class="backup-btn export-btn"
        onclick="exportData()"
      >
        💾 สำรองข้อมูล
      </button>

      <button
        class="backup-btn import-btn"
        onclick="document.getElementById('importFile').click()"
      >
        📂 นำเข้าข้อมูล
      </button>

    </div>

    <input
      type="file"
      id="importFile"
      accept=".json,application/json"
      style="display:none;"
      onchange="importData(event)"
    >

    <div class="backup-note">
      💡 แนะนำให้สำรองข้อมูลเก็บไว้เป็นระยะ<br>
      เพื่อป้องกันข้อมูลหายและสามารถย้ายเครื่องได้
    </div>

  </div>

</div>


<script>

/* =================================
   DATA
================================= */

let type = "expense";

let currentWeekKey = getWeekKey();

let allData =
  JSON.parse(
    localStorage.getItem("myMoneyWeeks")
  ) || {};


/* =================================
   สร้างข้อมูลสัปดาห์
================================= */

if (!allData[currentWeekKey]) {

  allData[currentWeekKey] = {

    weeklyMoney: 0,

    transactions: []

  };

}

saveData();


/* =================================
   หาเลขสัปดาห์
================================= */

function getWeekNumber(date) {

  const d =
    new Date(
      Date.UTC(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      )
    );

  const dayNum =
    d.getUTCDay() || 7;

  d.setUTCDate(
    d.getUTCDate() + 4 - dayNum
  );

  const yearStart =
    new Date(
      Date.UTC(
        d.getUTCFullYear(),
        0,
        1
      )
    );

  return Math.ceil(
    (
      (
        (d - yearStart) /
        86400000
      ) + 1
    ) / 7
  );

}


/* =================================
   KEY ของสัปดาห์
================================= */

function getWeekKey(date = new Date()) {

  const year =
    date.getFullYear();

  const week =
    getWeekNumber(date);

  return year + "-W" + week;

}


/* =================================
   ชื่อสัปดาห์
================================= */

function getWeekText(key) {

  const parts =
    key.split("-W");

  return (
    "สัปดาห์ที่ " +
    parts[1] +
    " ปี " +
    parts[0]
  );

}


/* =================================
   บันทึกข้อมูล
================================= */

function saveData() {

  localStorage.setItem(
    "myMoneyWeeks",
    JSON.stringify(allData)
  );

}


/* =================================
   เลือกประเภท
================================= */

function setType(newType) {

  type = newType;

  const incomeBtn =
    document.getElementById(
      "incomeBtn"
    );

  const expenseBtn =
    document.getElementById(
      "expenseBtn"
    );


  incomeBtn.className = "";

  expenseBtn.className = "";


  if (type === "income") {

    incomeBtn.className =
      "active-income";

  } else {

    expenseBtn.className =
      "active-expense";

  }

}


/* =================================
   เงินประจำสัปดาห์
================================= */

function saveWeeklyMoney() {

  const money =
    Number(
      document.getElementById(
        "weeklyMoney"
      ).value
    );


  if (
    isNaN(money) ||
    money < 0
  ) {

    alert(
      "กรุณากรอกจำนวนเงินให้ถูกต้อง"
    );

    return;

  }


  allData[currentWeekKey]
    .weeklyMoney = money;


  saveData();

  render();


  alert(
    "บันทึกเงินประจำสัปดาห์แล้ว 💰"
  );

}


/* =================================
   เพิ่มรายการ
================================= */

function addTransaction() {

  const date =
    document.getElementById(
      "date"
    ).value;


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const amount =
    Number(
      document.getElementById(
        "amount"
      ).value
    );


  if (
    !date ||
    !name ||
    isNaN(amount) ||
    amount <= 0
  ) {

    alert(
      "กรุณากรอกข้อมูลให้ครบถ้วน 💗"
    );

    return;

  }


  const transaction = {

    id: Date.now(),

    date: date,

    name: name,

    type: type,

    amount: amount

  };


  allData[currentWeekKey]
    .transactions
    .push(transaction);


  saveData();

  render();


  document.getElementById(
    "name"
  ).value = "";


  document.getElementById(
    "amount"
  ).value = "";


  alert(
    "บันทึกรายการแล้ว 💜"
  );

}


/* =================================
   ลบรายการ
================================= */

function deleteTransaction(id) {

  if (
    !confirm(
      "ต้องการลบรายการนี้ใช่ไหม?"
    )
  ) {

    return;

  }


  allData[currentWeekKey]
    .transactions =
      allData[currentWeekKey]
        .transactions
        .filter(
          item => item.id !== id
        );


  saveData();

  render();

}


/* =================================
   คำนวณข้อมูลสัปดาห์
================================= */

function calculateWeek(week) {

  let income =
    Number(week.weeklyMoney) || 0;

  let expense = 0;


  week.transactions.forEach(item => {

    const amount =
      Number(item.amount) || 0;


    if (
      item.type === "income"
    ) {

      income += amount;

    } else {

      expense += amount;

    }

  });


  return {

    income: income,

    expense: expense,

    totalMoney: income,

    balance: income - expense

  };

}


/* =================================
   แสดงข้อมูลสัปดาห์
================================= */

function render() {

  const week =
    allData[currentWeekKey];


  const result =
    calculateWeek(week);


  document.getElementById(
    "currentWeek"
  ).innerText =
    getWeekText(
      currentWeekKey
    );


  document.getElementById(
    "totalMoney"
  ).innerText =
    "฿" +
    result.totalMoney.toLocaleString();


  document.getElementById(
    "income"
  ).innerText =
    "฿" +
    result.income.toLocaleString();


  document.getElementById(
    "expense"
  ).innerText =
    "฿" +
    result.expense.toLocaleString();


  document.getElementById(
    "balance"
  ).innerText =
    "฿" +
    result.balance.toLocaleString();


  document.getElementById(
    "weeklyMoney"
  ).value =
    week.weeklyMoney || "";


  const realWeek =
    getWeekKey();


  const backButton =
    document.getElementById(
      "backCurrentBtn"
    );


  if (
    currentWeekKey === realWeek
  ) {

    backButton.style.display =
      "none";

  } else {

    backButton.style.display =
      "block";

  }


  document.getElementById(
    "transactionTitle"
  ).innerText =
    currentWeekKey === realWeek
    ? "📋 รายการของสัปดาห์นี้"
    : "📋 รายการของ" +
      getWeekText(currentWeekKey);


  renderTransactions();

  renderWeekHistory();

}


/* =================================
   แสดงรายการ
================================= */

function renderTransactions() {

  const container =
    document.getElementById(
      "transactions"
    );


  const transactions =
    allData[currentWeekKey]
      .transactions;


  if (
    transactions.length === 0
  ) {

    container.innerHTML =

      `<div class="empty">

        ยังไม่มีรายการ ✨

      </div>`;

    return;

  }


  const sorted =
    [...transactions].sort(
      (a,b) =>
        new Date(b.date) -
        new Date(a.date)
    );


  container.innerHTML =
    sorted.map(item => {

      const isIncome =
        item.type === "income";


      return `

        <div class="item">

          <div class="item-info">

            <div class="icon">

              ${
                isIncome
                ? "💰"
                : "🛍️"
              }

            </div>


            <div>

              <div class="item-name">

                ${escapeHTML(
                  item.name
                )}

              </div>


              <div class="item-date">

                ${formatDate(
                  item.date
                )}

              </div>

            </div>

          </div>


          <div>

            <span class="${
              isIncome
              ? "income-text"
              : "expense-text"
            }">

              ${
                isIncome
                ? "+"
                : "-"
              }

              ฿${Number(
                item.amount
              ).toLocaleString()}

            </span>


            <button

              class="delete-btn"

              onclick="
                deleteTransaction(
                  ${item.id}
                )
              "

            >

              ✕

            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =================================
   ประวัติสัปดาห์
================================= */

function renderWeekHistory() {

  const container =
    document.getElementById(
      "weekHistory"
    );


  const keys =
    Object.keys(allData)
      .sort()
      .reverse();


  if (
    keys.length === 0
  ) {

    container.innerHTML =
      `<div class="empty">
        ยังไม่มีประวัติ
      </div>`;

    return;

  }


  container.innerHTML =
    keys.map(key => {

      const week =
        allData[key];


      const result =
        calculateWeek(week);


      const isCurrent =
        key === currentWeekKey;


      return `

        <div
          class="week-card"
          onclick="
            viewWeek('${key}')
          "
        >

          <h4>

            ${
              getWeekText(key)
            }

            ${
              isCurrent
              ? " ⭐"
              : ""
            }

          </h4>


          <div class="week-info">

            <span>
              🟢 รายรับ
            </span>

            <span>
              ฿${result.income.toLocaleString()}
            </span>

          </div>


          <div class="week-info">

            <span>
              🔴 รายจ่าย
            </span>

            <span>
              ฿${result.expense.toLocaleString()}
            </span>

          </div>


          <div class="week-info">

            <span>
              💵 คงเหลือ
            </span>

            <span class="week-balance">

              ฿${result.balance.toLocaleString()}

            </span>

          </div>

        </div>

      `;

    }).join("");

}


/* =================================
   ดูสัปดาห์
================================= */

function viewWeek(key) {

  currentWeekKey = key;

  render();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =================================
   กลับสัปดาห์ปัจจุบัน
================================= */

function goToCurrentWeek() {

  const realWeek =
    getWeekKey();


  if (
    !allData[realWeek]
  ) {

    allData[realWeek] = {

      weeklyMoney: 0,

      transactions: []

    };

  }


  currentWeekKey =
    realWeek;


  saveData();

  render();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =================================
   วันที่ภาษาไทย
================================= */

function formatDate(dateString) {

  const date =
    new Date(dateString);


  return date.toLocaleDateString(
    "th-TH",
    {
      day: "numeric",
      month: "short",
      year: "numeric"
    }
  );

}


/* =================================
   ป้องกัน HTML
================================= */

function escapeHTML(text) {

  return String(text).replace(
    /[&<>"']/g,
    function(character) {

      return {

        "&": "&amp;",

        "<": "&lt;",

        ">": "&gt;",

        '"': "&quot;",

        "'": "&#039;"

      }[character];

    }
  );

}


/* =================================
   ตรวจสอบสัปดาห์ใหม่
================================= */

function checkNewWeek() {

  const realWeek =
    getWeekKey();


  if (
    !allData[realWeek]
  ) {

    allData[realWeek] = {

      weeklyMoney: 0,

      transactions: []

    };

  }


  currentWeekKey =
    realWeek;


  saveData();

}


/* =================================
   สำรองข้อมูล
================================= */

function exportData() {

  const data =
    JSON.stringify(
      allData,
      null,
      2
    );


  const blob =
    new Blob(
      [data],
      {
        type:
          "application/json"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href = url;

  link.download =
    "my-money-backup.json";


  document.body.appendChild(
    link
  );


  link.click();

  document.body.removeChild(
    link
  );


  URL.revokeObjectURL(
    url
  );


  alert(
    "สำรองข้อมูลเรียบร้อยแล้ว 💾💗"
  );

}


/* =================================
   นำเข้าข้อมูล
================================= */

function importData(event) {

  const file =
    event.target.files[0];


  if (!file) {

    return;

  }


  const reader =
    new FileReader();


  reader.onload =
    function(e) {

      try {

        const imported =
          JSON.parse(
            e.target.result
          );


        if (
          typeof imported !== "object" ||
          imported === null
        ) {

          throw new Error();

        }


        for (
          const key in imported
        ) {

          if (
            !imported[key].transactions ||
            !Array.isArray(
              imported[key].transactions
            )
          ) {

            throw new Error();

          }

        }


        const confirmImport =
          confirm(
            "นำเข้าข้อมูลนี้ใช่ไหม?\nข้อมูลเดิมในเว็บจะถูกแทนที่"
          );


        if (
          !confirmImport
        ) {

          event.target.value = "";

          return;

        }


        allData =
          imported;


        const realWeek =
          getWeekKey();


        if (
          !allData[realWeek]
        ) {

          allData[realWeek] = {

            weeklyMoney: 0,

            transactions: []

          };

        }


        currentWeekKey =
          realWeek;


        saveData();

        render();


        alert(
          "นำเข้าข้อมูลสำเร็จแล้ว 📂💗"
        );


      } catch(error) {

        alert(
          "ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลของ My Money ❌"
        );

      }


      event.target.value = "";

    };


  reader.readAsText(file);

}


/* =================================
   วันที่เริ่มต้น
================================= */

document.getElementById("date")
  .value =
  new Date()
    .toISOString()
    .split("T")[0];


/* =================================
   เริ่มเว็บ
================================= */

checkNewWeek();

render();

</script>
